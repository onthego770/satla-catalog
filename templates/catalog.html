{% extends "base.html" %}
{% block title %}Catalog · Satla Spirits{% endblock %}
{% block body %}
<main class="wrap"><div class="pad" id="view"{% if pdf_url %} data-pdf-url="{{ pdf_url }}"{% endif %}{% if prices %} data-prices="1"{% endif %}{% if upload_url %} data-upload-url="{{ upload_url }}"{% endif %}{% if price_url %} data-price-url="{{ price_url }}"{% endif %} data-csrf="{{ form_token() }}"><p class="meta">Loading the catalog…</p></div></main>
<div id="overlay"></div>
<script id="pdata" type="application/json">{{ products|tojson }}</script>
{% endblock %}
{% block scripts %}<script src="{{ asset('catalog.js') }}"></script>{% endblock %}
